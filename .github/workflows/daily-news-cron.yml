name: Daily 10 News Auto Scheduler

on:
  schedule:
    # 매일 한국 시간 오전 7시 (UTC 22:00) 컴퓨터가 꺼져있어도 클라우드에서 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 즉시 실행 가능

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Auto News Generator (10 articles)
        run: node scripts/auto-news-generator.js

      - name: Commit and Push Updated News
        run: |
          git config --global user.name "Auto News Bot"
          git config --global user.email "bot@lifenews.com"
          git add public/data/daily-news.json
          git commit -m "chore: [자동 스케줄러] 일일 생활 뉴스 10개 자동 생성 [skip ci]" || echo "No changes to commit"
          git push
